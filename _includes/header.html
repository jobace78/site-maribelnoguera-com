<header class="site-header">
    <div class="container">
        <nav class="site-nav" aria-label="Principal">
            <a class="site-brand" href="{{ '/' | relative_url }}">Maribel Noguera</a>
            <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-list"
                    aria-label="Abrir menú">☰</button>
            <ul class="nav-list" id="nav-list">
                <li><a href="{{ '/' | relative_url }}"
                       {% if page.url == '/' %}class="active" aria-current="page"{% endif %}>Inicio</a></li>
                <li><a href="{{ '/terapia/' | relative_url }}"
                       {% if page.url contains '/terapia' %}class="active"{% endif %}>Terapia</a></li>
                <li><a href="{{ '/coaching/' | relative_url }}"
                       {% if page.url contains '/coaching' %}class="active"{% endif %}>Coaching</a></li>
                <li><a href="{{ '/sobre-mi/' | relative_url }}"
                       {% if page.url contains '/sobre-mi' %}class="active"{% endif %}>Sobre mí</a></li>
                <li><a href="{{ '/contacto/' | relative_url }}"
                       {% if page.url contains '/contacto' %}class="active"{% endif %}>Contacto</a></li>
                <li><a class="btn btn-whatsapp" href="{{ site.whatsapp_link }}">WhatsApp</a></li>
            </ul>
        </nav>
    </div>
</header>
<script>
    (function () {
        var list = document.getElementById('nav-list');
        var toggle = document.querySelector('.nav-toggle');
        toggle.addEventListener('click', function () {
            var open = list.classList.toggle('open');
            toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        });
    })();
</script>
