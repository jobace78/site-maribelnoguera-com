<section class="contact-banner">
    <div class="container">
        <h2>{{ t.contact_banner.heading }}</h2>
        <p>{{ t.contact_banner.text }}</p>
        <a class="btn btn-accent" href="{{ site.whatsapp_link }}">{{ t.contact_banner.whatsapp_cta }}</a>
        <a class="btn btn-outline" href="{{ lang_prefix | append: '/contacto/' | relative_url }}">{{ t.contact_banner.form_cta }}</a>
    </div>
</section>
